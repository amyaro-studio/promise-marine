<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PROMISE MARINE - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #17324d;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccd6df;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      background: #17324d;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .danger {
      background: #b42318;
    }

    .secondary {
      background: #64748b;
    }

    .success {
      background: #18794e;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      background: #eef3f7;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 8px;
    }

    .boat-card {
      border: 1px solid #d9e1e7;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      background: #fafcfd;
    }

    .boat-card h3 {
      margin-bottom: 8px;
    }

    .boat-info {
      color: #526476;
      line-height: 1.7;
      margin-bottom: 10px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }

    .media-item {
      border: 1px solid #d9e1e7;
      border-radius: 10px;
      overflow: hidden;
      background: white;
      padding-bottom: 8px;
    }

    .media-item img,
    .media-item video {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
    }

    .media-item button {
      width: calc(100% - 12px);
      margin: 6px;
      padding: 8px;
      font-size: 13px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions button {
      margin-bottom: 0;
    }

    .edit-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      border: 1px solid #d9e1e7;
    }

    .top-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media(max-width:600px) {
      .container {
        padding: 12px;
        margin: 10px auto;
      }

      .box {
        padding: 18px;
      }

      .actions,
      .top-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

</div>


<script>

  // =========================
  // LOGIN
  // =========================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");

    message.innerHTML = "";

    if (!email || !password) {

      message.innerHTML =
        '<div class="message">اكتبي الإيميل والباسورد.</div>';

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

       if (error) {

      message.innerHTML =
        '<div class="message">' +
        error.message +
        '</div>';

      return;
    }

    if (!data.user || data.user.id !== ADMIN_UID) {

      await supabaseClient.auth.signOut();

      message.innerHTML =
        '<div class="message">هذا الحساب ليس لديه صلاحية Admin.</div>';

      return;
    }

    showAdmin();

  }

  // =========================
  // SHOW ADMIN
  // =========================

function showAdmin() {

  document
    .getElementById("loginBox")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.remove("hidden");

  loadBoats();
  loadServicesAdmin();

}

  // =========================
  // LOGOUT
  // =========================

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("loginBox")
      .classList.remove("hidden");

  }


  // =========================
  // CHECK SESSION
  // =========================

  async function checkSession() {

    const {
      data: { session }
    } =
      await supabaseClient.auth.getSession();

    if (
      session &&
      session.user &&
      session.user.id === ADMIN_UID
    ) {

      showAdmin();

    }

  }


  // =========================
  // ADD BOAT
  // =========================

  async function addBoat() {

    const result =
      document.getElementById("result");

    result.innerHTML =
      '<div class="message">جاري الحفظ...</div>';

    const nameAr =
      document.getElementById("nameAr").value.trim();

    const nameEn =
      document.getElementById("nameEn").value.trim();

    const descriptionAr =
      document.getElementById("descriptionAr").value.trim();

    const descriptionEn =
      document.getElementById("descriptionEn").value.trim();

    const price =
      document.getElementById("price").value;
    const currency = document.getElementById("currency").value;

    const lengthFt =
      document.getElementById("lengthFt").value;

    const capacity =
      document.getElementById("capacity").value;

    const category =
      document.getElementById("category").value.trim();

    const files =
      document.getElementById("mediaFiles").files;


    if (!nameAr || !nameEn) {

      result.innerHTML =
        '<div class="message">اكتبي اسم المركب بالعربي والإنجليزي.</div>';

      return;
    }


   const { data: boat, error: boatError } =
  await supabaseClient
    .from("boats")
    .insert({
      name_ar: nameAr,
      name_en: nameEn,
      description_ar: descriptionAr,
      description_en: descriptionEn,
      price: price ? Number(price) : null,
      currency: currency,
      length_ft: lengthFt ? Number(lengthFt) : null,
      capacity: capacity ? Number(capacity) : null,
      category: category || null
    })
    .select()
    .single();


    if (boatError) {

      result.innerHTML =
        '<div class="message">خطأ في إضافة المركب:\n' +
        boatError.message +
        '</div>';

      return;
    }


    for (let i = 0; i < files.length; i++) {

      const file = files[i];
const safeName =
  Date.now() +
  "_" +
  i +
  "_" +
  file.name
    .replace(/\.[^/.]+$/, "")
    .replace(/[^a-zA-Z0-9_-]/g, "_") +
  "." +
  file.name.split(".").pop().toLowerCase();

      const filePath =
        boat.id + "/" + safeName;


      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("boat-media")
          .upload(filePath, file);


      if (uploadError) {

        result.innerHTML =
          '<div class="message">المركب اتضاف، لكن حصل خطأ أثناء رفع الملف:\n' +
          uploadError.message +
          '</div>';

        return;
      }


      const { data: publicData } =
        supabaseClient
          .storage
          .from("boat-media")
          .getPublicUrl(filePath);


      const publicUrl =
        publicData.publicUrl;


      const isVideo =
        file.type.startsWith("video/");


      const { error: imageError } =
        await supabaseClient
          .from("boat_images")
          .insert({
            boat_id: boat.id,
            image_url: publicUrl,
            is_video: isVideo
          });


      if (imageError) {

        result.innerHTML =
          '<div class="message">المركب اتضاف لكن حصل خطأ في تسجيل الملف:\n' +
          imageError.message +
          '</div>';

        return;
      }

    }


    result.innerHTML =
      '<div class="message">✅ المركب اتضافت بنجاح!</div>';


    clearForm();

    await loadBoats();

  }


  // =========================

    document.getElementById("nameEn").value = "";
    document.getElementById("descriptionAr").value = "";
    document.getElementById("descriptionEn").value = "";
    document.getElementById("price").value = "";

    document.getElementById("lengthFt").value = "";
    document.getElementById("capacity").value = "";
    document.getElementById("category").value = "";
    document.getElementById("mediaFiles").value = "";

  }

    list.innerHTML = "";

          <label>الاسم بالعربي</label>
          <input
            id="edit-name-ar-${boat.id}"
            value="${escapeAttribute(boat.name_ar || "")}"
          >

          <label>الاسم بالإنجليزي</label>
          <input
            id="edit-name-en-${boat.id}"
            value="${escapeAttribute(boat.name_en || "")}"

          <label>الوصف بالعربي</label>

            id="edit-description-ar-${boat.id}"

          <textarea
            id="edit-description-en-${boat.id}"

         <label>السعر</label>
<input
  id="edit-price-${boat.id}"

>

<label>العملة</label>
<select id="edit-currency-${boat.id}">
  <option value="EGP" ${(boat.currency || "EGP") === "EGP" ? "selected" : ""}>جنيه مصري (EGP)</option>
  <option value="USD" ${boat.currency === "USD" ? "selected" : ""}>دولار أمريكي (USD)</option>
  <option value="EUR" ${boat.currency === "EUR" ? "selected" : ""}>يورو (EUR)</option>
</select>

          <label>الطول بالقدم</label>

  // =========================
  // LOAD BOAT MEDIA
  // =========================

  async function loadBoatMedia(boatId) {

    const container =
      document.getElementById(
        "media-" + boatId
      );

    if (!container) return;


    const { data: media, error } =
      await supabaseClient
        .from("boat_images")
        .select("*")
        .eq("boat_id", boatId)
        .order("id", {
          ascending: true
        });


    if (error) {

      container.innerHTML =
        '<div class="message">خطأ في تحميل الملفات.</div>';

      return;
    }


    if (!media || media.length === 0) {

      container.innerHTML =
        '<div class="boat-info">لا توجد صور أو فيديوهات.</div>';

      return;
    }


    const grid =
      document.createElement("div");

    grid.className = "media-grid";


    media.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "media-item";


      if (item.is_video) {

        div.innerHTML = `
          <video
            src="${item.image_url}"
            controls
            muted
          ></video>

          <button
            class="danger"
            onclick="deleteMedia(
              ${item.id},
              '${escapeJs(item.image_url)}'
            )"
          >
            حذف الفيديو
          </button>
        `;

      } else {

        div.innerHTML = `
          <img
            src="${item.image_url}"
            alt="Boat media"
          >

          <button
            class="danger"
            onclick="deleteMedia(
              ${item.id},
              '${escapeJs(item.image_url)}'
            )"
          >
            حذف الصورة
          </button>
        `;

      }


      grid.appendChild(div);

    });


    container.innerHTML = "";
    container.appendChild(grid);

  }

  // =========================
  // SAVE BOAT
  // =========================

  async function saveBoat(boatId) {

    const nameAr =
      document.getElementById(
        "edit-name-ar-" + boatId
      ).value.trim();

    const nameEn =
      document.getElementById(
        "edit-name-en-" + boatId
      ).value.trim();

    const descriptionAr =
      document.getElementById(
        "edit-description-ar-" + boatId
      ).value.trim();

    const descriptionEn =
      document.getElementById(
        "edit-description-en-" + boatId
      ).value.trim();

    const price =
      document.getElementById(
        "edit-price-" + boatId
      ).value;
    const currency =
  document.getElementById(
    "edit-currency-" + boatId
  ).value;

    const lengthFt =
      document.getElementById(
        "edit-length-" + boatId
      ).value;

    const capacity =
      document.getElementById(
        "edit-capacity-" + boatId
      ).value;

    const category =
      document.getElementById(
        "edit-category-" + boatId
      ).value.trim();

    const files =
      document.getElementById(
        "edit-media-" + boatId
      ).files;


    if (!nameAr || !nameEn) {

      alert(
        "اكتبي اسم المركب بالعربي والإنجليزي."
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("boats")
        .update({
          name_ar: nameAr,
          name_en: nameEn,
          description_ar: descriptionAr,
          description_en: descriptionEn,
          price: price ? Number(price) : null,
          currency: currency,
          length_ft: lengthFt ? Number(lengthFt) : null,
          capacity: capacity ? Number(capacity) : null,
          category: category || null
        })
        .eq("id", boatId);


    if (error) {

      alert(
        "حصل خطأ أثناء تعديل المركب:\n" +
        error.message
      );

      return;
    }


    if (files.length > 0) {

      for (let i = 0; i < files.length; i++) {

        const file = files[i];

const safeName =
  Date.now() +
  "_" +
  i +
  "_" +
  file.name
    .replace(/\.[^/.]+$/, "")
    .replace(/[^a-zA-Z0-9_-]/g, "_") +
  "." +
  file.name.split(".").pop().toLowerCase();
        const filePath =
          boatId + "/" + safeName;


        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("boat-media")
            .upload(filePath, file);


        if (uploadError) {

          alert(
            "تم تعديل البيانات، لكن حصل خطأ في رفع أحد الملفات:\n" +
            uploadError.message
          );

          await loadBoats();

          return;
        }


        const { data: publicData } =
          supabaseClient
            .storage
            .from("boat-media")
            .getPublicUrl(filePath);


        const { error: mediaError } =
          await supabaseClient
            .from("boat_images")
            .insert({
              boat_id: boatId,
              image_url: publicData.publicUrl,
              is_video: file.type.startsWith("video/")
            });


        if (mediaError) {

          alert(
            "تم رفع الملف، لكن حصل خطأ في تسجيله:\n" +
            mediaError.message
          );

          await loadBoats();

          return;
        }

      }

    }


    alert("تم حفظ التعديلات بنجاح.");

    await loadBoats();

  }


  // =========================
  // DELETE MEDIA
  // =========================

  async function deleteMedia(
    mediaId,
    publicUrl
  ) {

    const confirmed =
      confirm(
        "هل تريدين حذف هذا الملف؟"
      );

    if (!confirmed) return;


    const marker =
      "/storage/v1/object/public/boat-media/";

    const index =
      publicUrl.indexOf(marker);


    if (index !== -1) {

      const filePath =
        decodeURIComponent(
          publicUrl.substring(
            index + marker.length
          )
        );


      await supabaseClient
        .storage
        .from("boat-media")
        .remove([filePath]);

    }


    const { error } =
      await supabaseClient
        .from("boat_images")
        .delete()
        .eq("id", mediaId);


    if (error) {

      alert(
        "حصل خطأ أثناء حذف الملف:\n" +
        error.message
      );

      return;
    }


    alert("تم حذف الملف.");

    await loadBoats();

  }


  // =========================
  // DELETE BOAT
  // =========================

  async function deleteBoat(boatId) {

    const confirmed =
      confirm(
        "هل أنتِ متأكدة من حذف المركب وكل الصور والفيديوهات الخاصة به؟"
      );

    if (!confirmed) return;


    const { data: media } =
      await supabaseClient
        .from("boat_images")
        .select("*")
        .eq("boat_id", boatId);


    if (media && media.length > 0) {

      const paths = [];


      for (const item of media) {

        const marker =
          "/storage/v1/object/public/boat-media/";

        const index =
          item.image_url.indexOf(marker);


        if (index !== -1) {

          const path =
            decodeURIComponent(
              item.image_url.substring(
                index + marker.length
              )
            );

          paths.push(path);

        }

      }


      if (paths.length > 0) {

        await supabaseClient
          .storage
          .from("boat-media")
          .remove(paths);

      }


      const { error: mediaDeleteError } =
        await supabaseClient
          .from("boat_images")
          .delete()
          .eq("boat_id", boatId);


      if (mediaDeleteError) {

        alert(
          "حصل خطأ في حذف ملفات المركب:\n" +
          mediaDeleteError.message
        );

        return;
      }

    }


    const { error } =
      await supabaseClient
        .from("boats")
        .delete()
        .eq("id", boatId);


    if (error) {

      alert(
        "حصل خطأ أثناء حذف المركب:\n" +
        error.message
      );

      return;
    }


    alert("تم حذف المركب وكل ملفاته بنجاح.");

    await loadBoats();

  }


  // =========================
  // SECURITY HELPERS
  // =========================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  function escapeJs(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "\\r");

  }

async function saveService(serviceId) {

    document.getElementById(
      "service-title-en-" + serviceId
    ).value.trim();

async function deleteSelectedServiceMedia(serviceId) {

  const selected =
    Array.from(
      document.querySelectorAll(
        "#service-media-" + serviceId +
        " .service-media-checkbox:checked"
      )
    );

  if (!selected.length) {

    alert(
      "اختاري الملفات التي تريدين حذفها أولًا."
    );

    return;
  }

  if (!confirm(
    "هل تريدين حذف الملفات المحددة؟"
  )) {
    return;
  }

  for (const checkbox of selected) {

    const mediaId =
      Number(checkbox.dataset.mediaId);

    const mediaUrl =
      checkbox.dataset.mediaUrl;

    const { error: dbError } =
      await supabaseClient
        .from("service_media")
        .delete()
        .eq("id", mediaId);

    if (dbError) {

      console.error(
        "Delete error:",
        dbError.message
      );

      continue;
    }

    const marker =
      "/service-media/";

    const markerIndex =
      mediaUrl.indexOf(marker);

    if (markerIndex !== -1) {

      const filePath =
        decodeURIComponent(
          mediaUrl.substring(
            markerIndex + marker.length
          )
        );

      await supabaseClient
        .storage
        .from("service-media")
        .remove([filePath]);
    }

  }

  alert("تم حذف الملفات المحددة.");

  await loadServiceMedia(serviceId);

}

  // =========================
// UPLOAD SERVICE MEDIA
// =========================

async function uploadServiceMedia(serviceId) {

  const input =
    document.getElementById(
      "service-files-" + serviceId
    );

  if (!input || !input.files.length) {

    alert("اختاري صورة أو فيديو أولًا.");

    return;
  }

  const service =
    await getServiceById(serviceId);

  if (!service) {

    alert("لم يتم العثور على الخدمة.");

    return;
  }

  const files =
    Array.from(input.files);

  for (let i = 0; i < files.length; i++) {

    const file = files[i];

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const safeName =
      Date.now() +
      "_" +
      i +
      "_" +
      file.name
        .replace(/\.[^/.]+$/, "")
        .replace(/[^a-zA-Z0-9_-]/g, "_") +
      "." +
      extension;

    const filePath =
      service.service_key +
      "/" +
      safeName;

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("service-media")
        .upload(
          filePath,
          file
        );

    if (uploadError) {

      alert(
        "حصل خطأ أثناء رفع الملف:\n" +
        uploadError.message
      );

      return;
    }

    const { data: publicData } =
      supabaseClient
        .storage
        .from("service-media")
        .getPublicUrl(filePath);

    const mediaUrl =
      publicData.publicUrl;

    const isVideo =
      file.type.startsWith("video/");

    const { error: dbError } =
      await supabaseClient
        .from("service_media")
        .insert({

          service_key:
            service.service_key,

          media_url:
            mediaUrl,

          is_video:
            isVideo

        });

    if (dbError) {

      alert(
        "تم رفع الملف لكن حصل خطأ في تسجيله:\n" +
        dbError.message
      );

      return;
    }

  }

  alert("تم رفع الملفات بنجاح.");

  input.value = "";

  await loadServiceMedia(serviceId);

}
  // =========================
// DELETE SERVICE MEDIA
// =========================

async function deleteServiceMedia(mediaId, mediaUrl) {

  if (!confirm("هل تريدين حذف هذا الملف؟")) {
    return;
  }

  // Get the media record first
  const { data: mediaItem, error: mediaError } =
    await supabaseClient
      .from("service_media")
      .select("service_key")
      .eq("id", mediaId)
      .single();

  if (mediaError || !mediaItem) {

    alert(
      "لم يتم العثور على الملف:\n" +
      (mediaError?.message || "")
    );

    return;
  }

  const serviceKey = mediaItem.service_key;

  // Delete from database
  const { error: dbError } =
    await supabaseClient
      .from("service_media")
      .delete()
      .eq("id", mediaId);

  if (dbError) {

    alert(
      "حصل خطأ أثناء حذف الملف:\n" +
      dbError.message
    );

    return;
  }

  // Delete from Storage
  const marker = "/service-media/";

  const markerIndex =
    mediaUrl.indexOf(marker);

  if (markerIndex !== -1) {

    const filePath =
      decodeURIComponent(
        mediaUrl.substring(
          markerIndex + marker.length
        )
      );

    const { error: storageError } =
      await supabaseClient
        .storage
        .from("service-media")
        .remove([filePath]);

    if (storageError) {

      console.warn(
        "تم حذف السجل من قاعدة البيانات، لكن تعذر حذف الملف من Storage:",
        storageError.message
      );
    }
  }

  // Get service ID
  const { data: service, error: serviceError } =
    await supabaseClient
      .from("services")
      .select("id")
      .eq("service_key", serviceKey)
      .single();

  if (serviceError || !service) {

    alert("تم حذف الملف، لكن تعذر تحديث قائمة الميديا.");

    return;
  }

  await loadServiceMedia(service.id);

}

async function getServiceById(serviceId) {

  const { data, error } =

      .from("services")

      .single();

  if (error) {

    console.error(

      error.message
    );

    return null;
  }

  return data;

async function updatePassword() {

  const password =
    document.getElementById("newPassword").value;

  const confirm =
    document.getElementById("confirmPassword").value;

  const message =
    document.getElementById("resetMessage");


  if (password.length < 6) {

    message.innerHTML =
      '<div class="message">Password must be at least 6 characters.</div>';

    return;
  }


  if (password !== confirm) {

    message.innerHTML =
      '<div class="message">Passwords do not match.</div>';

    return;
  }


  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });


  if (error) {

    message.innerHTML =
      '<div class="message">' + error.message + '</div>';

    return;
  }


  message.innerHTML =
    '<div class="message">Password updated successfully.</div>';
}
